<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Flight Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <img src="logo.png" class="logo">
</header>

<div class="container">

  <form id="searchForm" class="card">

    <div class="row">
      <div>
        <label>From (city or airport)</label>
        <input id="origin" required>
      </div>

      <div>
        <label>To (city or airport)</label>
        <input id="destination" required>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Trip type</label>
        <select id="tripType">
          <option value="oneway">One way</option>
          <option value="roundtrip">Round trip</option>
        </select>
      </div>

      <div>
        <label>Departure</label>
        <input type="date" id="date" required>
      </div>

      <div id="returnDateContainer" class="hidden">
        <label>Return</label>
        <input type="date" id="returnDate">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Adults</label>
        <input type="number" id="adults" value="1" min="1">
      </div>

      <div>
        <label>Children</label>
        <input type="number" id="children" value="0" min="0">
      </div>

      <div>
        <label>Stops</label>
        <select id="stopFilter">
          <option value="all">All</option>
          <option value="direct">Direct only</option>
          <option value="layover">With layover</option>
        </select>
      </div>

      <div>
        <label>Sort</label>
        <select id="sortBy">
          <option value="price">Lowest price</option>
          <option value="duration">Shortest trip</option>
        </select>
      </div>
    </div>

    <button class="primary-btn">Search flights</button>

  </form>

  <div id="results"></div>

  <div class="pager">
    <button id="prevPage">Previous</button>
    <span id="pageLabel"></span>
    <button id="nextPage">Next</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
